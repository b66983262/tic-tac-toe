<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Tic-Tac-Toe (3-Mark Rule)</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Retro Font/Styling Simulation */
        body {
            font-family: monospace, sans-serif; /* Simulating digital/monospace display */
            background-color: #282C34; /* Dark background */
        }
        h1 {
            text-shadow: 2px 2px #1F1F1F; /* Slight shadow for a deeper, digital look */
            color: #FFDE00; /* Bright yellow title */
        }
        .retro-box {
            background-color: #333740; /* Darker card background */
            border: 4px solid #FFDE00; /* Yellow border for arcade cabinet feel */
            box-shadow: 0 0 20px rgba(255, 222, 0, 0.3); /* Yellow outer glow */
        }
        
        /* Cell Styling */
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem; /* Slightly larger text */
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            user-select: none;
            color: #E5E7EB; 
            font-weight: 700;
        }
        /* Mobile adjustment */
        @media (max-width: 640px) {
            .cell {
                width: 80px;
                height: 80px;
                font-size: 3.5rem;
            }
        }
        /* Hover effect */
        .cell:hover:not(.x):not(.o) {
            background-color: #44475A; /* Lighter hover */
        }

        /* High-Contrast Retro Colors for X and O */
        .x { color: #FF4444; /* Bright Red */ } 
        .o { color: #44BBFF; /* Bright Cyan */ }
        .win-highlight {
            background-color: #00FF99 !important; /* Neon Green win highlight */
            box-shadow: 0 0 10px #00FF99;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="retro-box p-8 rounded-xl w-full max-w-lg">
        <h1 class="text-4xl font-extrabold text-center mb-6">ARCADE 3-MARK TTT</h1>
        
        <!-- Scoreboard -->
        <div class="flex justify-around items-center text-white text-2xl mb-6 p-3 rounded-lg bg-gray-700 border-2 border-gray-600">
            <div class="text-center">
                <span class="x font-bold">X</span> Score: <span id="x-score" class="x font-extrabold">0</span>
            </div>
            <div class="text-center">
                <span class="o font-bold">O</span> Score: <span id="o-score" class="o font-extrabold">0</span>
            </div>
        </div>

        <!-- Game Status and Message Area -->
        <div id="status-message" class="text-center text-xl font-medium mb-6 p-3 rounded-lg bg-gray-600 text-white border-2 border-gray-500">
            Player X's turn
        </div>

        <!-- Game Board (3x3 Grid) -->
        <div id="game-board" class="grid grid-cols-3 mx-auto max-w-xs sm:max-w-md">
            <!-- Grid cells -->
            <div data-cell-index="0" class="cell border-b-2 border-r-2 border-gray-500 rounded-tl-lg"></div>
            <div data-cell-index="1" class="cell border-b-2 border-r-2 border-gray-500"></div>
            <div data-cell-index="2" class="cell border-b-2 border-gray-500 rounded-tr-lg"></div>

            <div data-cell-index="3" class="cell border-b-2 border-r-2 border-gray-500"></div>
            <div data-cell-index="4" class="cell border-b-2 border-r-2 border-gray-500"></div>
            <div data-cell-index="5" class="cell border-b-2 border-gray-500"></div>

            <div data-cell-index="6" class="cell border-r-2 border-gray-500 rounded-bl-lg"></div>
            <div data-cell-index="7" class="cell border-r-2 border-gray-500"></div>
            <div data-cell-index="8" class="cell rounded-br-lg"></div>
        </div>
        
        <!-- Control Buttons -->
        <div class="text-center mt-8 space-x-4">
            <button id="restart-button" 
                    class="px-6 py-3 bg-green-500 hover:bg-green-600 text-gray-900 font-extrabold rounded-lg shadow-md transition-all duration-150 transform active:scale-95 border-2 border-white">
                NEW GAME (KEEP SCORE)
            </button>
            <button id="reset-score-button" 
                    class="px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg shadow-md transition-all duration-150 transform active:scale-95 border-2 border-white text-sm">
                RESET SCORES
            </button>
        </div>

    </div>

    <script>
        // --- GAME LOGIC ---

        // 1. Game State Variables
        let board = ["", "", "", "", "", "", "", "", ""]; // Represents the 9 cells
        let currentPlayer = "X";
        let gameActive = true;
        const MAX_MOVES = 3; // The maximum number of marks allowed per player
        
        // NEW: Variable to track who starts the next round (initialized to X)
        let starterPlayer = "X"; 

        // Score variables and move queues
        let xScore = 0;
        let oScore = 0;
        let xMovesQueue = [];
        let oMovesQueue = [];

        // 2. DOM Elements
        const statusDisplay = document.getElementById('status-message');
        const restartButton = document.getElementById('restart-button');
        const resetScoreButton = document.getElementById('reset-score-button');
        const cells = document.querySelectorAll('.cell');
        // Score DOM elements
        const xScoreDisplay = document.getElementById('x-score');
        const oScoreDisplay = document.getElementById('o-score');


        // 3. Winning Conditions (all possible 3-in-a-row combinations)
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // 4. Message Functions
        const winningMessage = () => `Player ${currentPlayer} WINS! Press NEW GAME to continue.`;
        const currentPlayerTurn = () => `Player ${currentPlayer}'s turn`;

        // 5. Initial Display
        statusDisplay.innerHTML = currentPlayerTurn();
        
        // Scoreboard Update Function
        function updateScoreboard() {
            xScoreDisplay.textContent = xScore;
            oScoreDisplay.textContent = oScore;
        }

        // --- GAME FUNCTIONS ---

        function handleCellPlayed(clickedCell, clickedCellIndex) {
            const queue = currentPlayer === "X" ? xMovesQueue : oMovesQueue;
            
            // 1. Process the new move
            board[clickedCellIndex] = currentPlayer;
            clickedCell.innerHTML = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase());
            
            // 2. Add new move to the queue
            queue.push(clickedCellIndex);

            // 3. Implement the 3-mark constraint (queue logic)
            if (queue.length > MAX_MOVES) {
                // Remove the oldest move index (the first element in the queue)
                const oldestMoveIndex = queue.shift(); 

                // Clear the old position in the main board array
                board[oldestMoveIndex] = ""; 

                // Clear the old position visually
                const oldestCell = document.querySelector(`[data-cell-index="${oldestMoveIndex}"]`);
                if (oldestCell) {
                    // Remove the other player's class just in case of a bug, and remove win highlight
                    oldestCell.innerHTML = "";
                    oldestCell.classList.remove('x', 'o', 'win-highlight'); 
                }
            }
        }

        function handlePlayerChange() {
            // Switch player and update the status message
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.innerHTML = currentPlayerTurn();
            statusDisplay.classList.remove('bg-red-700', 'bg-yellow-700', 'bg-green-700');
            statusDisplay.classList.add('bg-gray-600');
        }

        function handleResultValidation() {
            let roundWon = false;
            let winningCells = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                let a = board[winCondition[0]];
                let b = board[winCondition[1]];
                let c = board[winCondition[2]];

                if (a === '' || b === '' || c === '') {
                    continue;
                }
                
                if (a === b && b === c) {
                    roundWon = true;
                    winningCells = winCondition;
                    break;
                }
            }

            if (roundWon) {
                // 1. Update Score and Display
                if (currentPlayer === "X") {
                    xScore++;
                } else {
                    oScore++;
                }
                updateScoreboard();

                // 2. Highlight winning cells
                winningCells.forEach(index => {
                    cells[index].classList.add('win-highlight');
                });

                // 3. Update Status
                statusDisplay.innerHTML = winningMessage();
                statusDisplay.classList.replace('bg-gray-600', 'bg-green-700');
                gameActive = false;
                return;
            }

            // If no win, continue to the next player
            handlePlayerChange();
        }

        function handleCellClick(clickedCellEvent) {
            const clickedCell = clickedCellEvent.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-cell-index'));

            // 1. Check if the game is inactive OR if the cell is occupied by the *other* player.
            // A player can only place a mark in an empty spot or a spot they already occupy (to trigger removal).
            if (!gameActive || (board[clickedCellIndex] !== "" && board[clickedCellIndex] !== currentPlayer)) {
                return;
            }
            
            // 2. Process the move
            handleCellPlayed(clickedCell, clickedCellIndex);
            
            // 3. Check the result
            handleResultValidation();
        }

        function handleRestartGame() {
            // Step 1: Alternate the player who starts the next round
            starterPlayer = starterPlayer === "X" ? "O" : "X";
            
            // Reset game state for a new round
            gameActive = true;
            currentPlayer = starterPlayer; // Set current player based on alternation
            board = ["", "", "", "", "", "", "", "", ""];
            
            // Reset the move queues
            xMovesQueue = [];
            oMovesQueue = [];

            // Reset message and colors
            statusDisplay.innerHTML = currentPlayerTurn();
            statusDisplay.classList.remove('bg-green-700', 'bg-yellow-700');
            statusDisplay.classList.add('bg-gray-600');
            
            // Clear the visual board
            cells.forEach(cell => {
                cell.innerHTML = "";
                cell.classList.remove('x', 'o', 'win-highlight');
            });
        }
        
        function handleResetScores() {
            xScore = 0;
            oScore = 0;
            // Reset starter player to X when scores are fully reset
            starterPlayer = "X"; 
            updateScoreboard();
            handleRestartGame();
        }

        // --- EVENT LISTENERS ---

        // Add click listener to each cell
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        
        // Add click listener to the restart button
        restartButton.addEventListener('click', handleRestartGame);
        
        // Add listener for the reset score button
        resetScoreButton.addEventListener('click', handleResetScores);

        // Initialize score display
        updateScoreboard();
    </script>
</body>
</html>
